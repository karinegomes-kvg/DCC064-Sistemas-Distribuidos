version: '3.8'

networks:
  dns_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  root_dns:
    image: python:3.12-slim
    container_name: root_dns
    volumes:
      - .:/app
    working_dir: /app
    command: python -u dns_server.py
    healthcheck:
      test: ["CMD", "python", "verificar_prontidao.py", "5300"]
      interval: 1s
      timeout: 2s
      retries: 15
    environment:
      - DNS_ROLE=ROOT
      - DNS_VERBOSE=${DNS_VERBOSE:-false}
      - DB_PATH=root_db.json
      - LIMITE_POR_IP=${LIMITE_DNS_POR_IP:-100}
      - LIMITE_GLOBAL=${LIMITE_DNS_GLOBAL:-200}
    networks:
      dns_network:
        ipv4_address: 172.20.0.100

  tld_dns:
    image: python:3.12-slim
    container_name: tld_dns
    volumes:
      - .:/app
    working_dir: /app
    command: python -u dns_server.py
    healthcheck:
      test: ["CMD", "python", "verificar_prontidao.py", "5300"]
      interval: 1s
      timeout: 2s
      retries: 15
    environment:
      - DNS_ROLE=TLD
      - DNS_VERBOSE=${DNS_VERBOSE:-false}
      - DB_PATH=tld_db.json
      - LIMITE_POR_IP=${LIMITE_DNS_POR_IP:-100}
      - LIMITE_GLOBAL=${LIMITE_DNS_GLOBAL:-200}
    networks:
      dns_network:
        ipv4_address: 172.20.0.101

  auth_dns:
    image: python:3.12-slim
    container_name: auth_dns
    volumes:
      - .:/app
    working_dir: /app
    command: python -u dns_server.py
    healthcheck:
      test: ["CMD", "python", "verificar_prontidao.py", "5300"]
      interval: 1s
      timeout: 2s
      retries: 15
    environment:
      - DNS_ROLE=AUTH
      - DNS_VERBOSE=${DNS_VERBOSE:-false}
      - DB_PATH=auth_db.json
      - LIMITE_POR_IP=${LIMITE_DNS_POR_IP:-100}
      - LIMITE_GLOBAL=${LIMITE_DNS_GLOBAL:-200}
    networks:
      dns_network:
        ipv4_address: 172.20.0.102

  local_resolver:
    image: python:3.12-slim
    container_name: local_resolver
    volumes:
      - .:/app
    working_dir: /app
    command: python -u resolver.py
    healthcheck:
      test: ["CMD", "python", "verificar_prontidao.py", "5353"]
      interval: 1s
      timeout: 2s
      retries: 15
    environment:
      - ROOT_DNS_IP=172.20.0.100
      - DNS_VERBOSE=${DNS_VERBOSE:-false}
      - LIMITE_POR_IP=${LIMITE_RESOLVER_POR_IP:-20}
      - LIMITE_GLOBAL=${LIMITE_RESOLVER_GLOBAL:-100}
    networks:
      dns_network:
        ipv4_address: 172.20.0.50
    ports:
    - "5354:5353/udp" # Alteração da porta para 5354
